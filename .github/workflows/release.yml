name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag version to release (without v)'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
      - name: Validate tag against package version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1']))
          package = next(p for p in metadata['packages'] if p['name'] == 'skillsrs')
          version = os.environ['REQUESTED_VERSION'] or os.environ['GITHUB_REF_NAME'].removeprefix('v')
          if version != package['version']:
              raise SystemExit(f"Tag version {version!r} differs from skillsrs {package['version']!r}")
          tag = 'v' + version
          subprocess.run(['git', 'rev-parse', '--verify', 'refs/tags/' + tag], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\ntag={tag}\n')
          PY
      - name: Test release source
        run: cargo test --locked -p skillsrs --all-features
      - name: Validate crate packaging
        run: cargo publish --locked -p skillsrs --dry-run
      - name: Install audit tool
        run: cargo install cargo-audit --locked
      - name: Audit release dependencies
        run: python3 scripts/audit.py

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: skills-linux-x86_64
            binary: skills
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: skills-linux-aarch64
            binary: skills
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: skills-macos-x86_64
            binary: skills
          - os: macos-15
            target: aarch64-apple-darwin
            asset: skills-macos-aarch64
            binary: skills
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: skills-windows-x86_64
            binary: skills.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.target }}
      - name: Build locked native binary
        run: cargo build --locked --release -p skillsrs --bin skills --target ${{ matrix.target }}
      - name: Validate binary
        shell: bash
        run: |
          target/${{ matrix.target }}/release/${{ matrix.binary }} --version
          target/${{ matrix.target }}/release/${{ matrix.binary }} server http --help
      # Cargo's release profile strips symbols with the native target toolchain.
      - name: Archive binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ '${{ runner.os }}' == 'Windows' ]]; then
            (cd target/${{ matrix.target }}/release && 7z a ../../../dist/${{ matrix.asset }}.zip ${{ matrix.binary }})
          else
            tar -C target/${{ matrix.target }}/release -czf dist/${{ matrix.asset }}.tar.gz ${{ matrix.binary }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
      - name: Publish single crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked -p skillsrs

  release:
    needs: [validate, build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: skills-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Publish validated release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "Release $RELEASE_TAG"
