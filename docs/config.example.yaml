# Safe starting point; paths default to platform directories unless overridden.
# Docker uses this file with --path /data and a non-loopback HTTP bind.
# For HTTP, set SKILLS_HTTP_TOKEN securely before starting the process.
server:
  auth_token_env: "SKILLS_HTTP_TOKEN"

policy:
  mode: standard
  management_enabled: false
  enforce_server_trust: true
  default_risk: unknown
  require_consent_for: [writes, destructive, admin, unknown]
  trusted_servers: []
  allow_patterns: ["*"]
  deny_patterns: []
  deny_tags: []
  max_exec_ms: 120000

# Enforced native isolation: Bubblewrap on Linux (requires bwrap + namespaces),
# Docker elsewhere (requires a reachable daemon). Omit backend for that default.
# Missing isolation is an error. Reading skill instructions does not run code.
sandbox:
  timeout_ms: 30000
  allow_read: []
  allow_write: []
  allow_network: false
  max_memory_bytes: 536870912
  max_cpu_seconds: 30
  max_output_bytes: 8388608

# Optional explicit paths. Prefer absolute paths in service configurations.
# --path /data or SKILLS_PATH=/data selects an isolated managed storage root.
# paths:
#   data_dir: "/var/lib/skills"
#   database_path: "/var/lib/skills/skills.db"
#   cache_dir: "/var/cache/skills"
#   logs_dir: "/var/log/skills"

use_global:
  enabled: false

# Configure only reviewed upstream programs/endpoints. Discovery is not trust.
upstreams: []
# Example HTTP upstream (replace the endpoint; add alias to trusted_servers
# only when you intend to authorize execution):
# upstreams:
#   - alias: internal
#     transport: http
#     url: "https://mcp.example.com/mcp"
#     required: true
#     tags: [internal]
#     auth:
#       type: bearer
#       env: INTERNAL_MCP_TOKEN
#
# Example native stdio upstream, requiring a reviewed installed executable:
#   - alias: local
#     transport: stdio
#     command: ["/usr/local/bin/reviewed-mcp-server"]
#     tags: [local]
#     sandbox_config:
#       backend: bubblewrap
#       allow_read: ["/workspace/reference"]
#
# timeout/restricted are NOT filesystem/network isolation. Trusted native
# processes may explicitly use backend: timeout with allow_network: true and
# no allow_read/allow_write lists. Never describe this as a secure sandbox.

# Pin git_ref to a reviewed full commit for reproducibility. Moving refs are
# checked against real upstream commits by `skills check` and `skills sync`.
agent_skills_repos: []
# agent_skills_repos:
#   - repo: "owner/repo"
#     skills: ["review-notes"]
#     git_ref: "<reviewed-40-hex-commit>"
#
# `skills add` extends repository selections. `skills check` previews changes;
# `skills sync` applies them. Server startup does not sync configured sources.
